name: Brain scan

# הריפו מדווח על עצמו למוח השני. הסורק נמשך מהמוח כדי שכל הריפואים
# ירוצו על אותה גרסה בלי לשכפל קוד. אין כאן סוד מלבד טוקן הקליטה.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report this repo to the second brain
        env:
          BRAIN_INGEST_TOKEN: ${{ secrets.BRAIN_INGEST_TOKEN }}
        run: |
          curl -fsSL https://web-production-9f010.up.railway.app/static/scan_repo.py -o /tmp/scan_repo.py
          python3 /tmp/scan_repo.py
